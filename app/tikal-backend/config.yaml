  Identity__Authority: "https://auth.tikalonline.com"
  Database__DatabaseName: "tikal"
  Database__Host: "cnpg-cluster-rw.cnpg-cluster.svc.cluster.local"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://grafana-k8s-monitoring-alloy-receiver.monitoring.svc.cluster.local:4317"
  OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"